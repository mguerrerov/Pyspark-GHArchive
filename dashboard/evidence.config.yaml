# Project page de GitHub Pages: el sitio cuelga de /<repo>/, no de la raiz del
# dominio. Evidence lo lee de aqui y solo de aqui, y lo pasa a `paths.base` de
# SvelteKit; no lo lee de ninguna variable de entorno. Sin esto el HTML pide
# /_app/... en vez de /Pyspark-GHArchive/_app/..., los ficheros dan 404 y la
# pagina se sirve sin CSS ni JS, con el build en verde.
deployment:
  basePath: /Pyspark-GHArchive

appearance:
  default: system
  switcher: true

theme:
  colorPalettes:
    default:
      light:
        - "#236aa4"
        - "#45a1bf"
        - "#a5cdee"
        - "#8dacbf"
        - "#85c7c6"
        - "#d2c6ac"
        - "#f4b548"
        - "#8f3d56"
        - "#71b9f4"
        - "#46a485"
      dark:
        - "#236aa4"
        - "#45a1bf"
        - "#a5cdee"
        - "#8dacbf"
        - "#85c7c6"
        - "#d2c6ac"
        - "#f4b548"
        - "#8f3d56"
        - "#71b9f4"
        - "#46a485"
  colorScales:
    default:
      light:
        - "#ADD8E6"
        - "#00008B"
      dark:
        - "#ADD8E6"
        - "#00008B"
  colors:
    primary:
      light: "#2563eb"
      dark: "#3b82f6"
    accent:
      light: "#c2410c"
      dark: "#fdba74"
    base:
      light: "#ffffff"
      dark: "#09090b"
    info:
      light: "#0284c7"
      dark: "#38bdf8"
    positive:
      light: "#16a34a"
      dark: "#4ade80"
    warning:
      light: "#f8c900"
      dark: "#fbbf24"
    negative:
      light: "#dc2626"
      dark: "#f87171"

plugins:
  components:
    # This loads all of evidence's core charts and UI components
    # You probably don't want to edit this dependency unless you know what you are doing
    "@evidence-dev/core-components": {}

  datasources:
    # Solo duckdb: los datos son los Parquet agregados que exporta
    # exportar_gold.py. El template traia doce conectores mas, que alargaban
    # la instalacion en Actions sin usarse.
    "@evidence-dev/duckdb": { }
