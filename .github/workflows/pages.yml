name: Publicar el dashboard en GitHub Pages

# El sitio se construye a partir de los Parquet agregados que viven en
# dashboard/sources/gharchive/. El runner NO tiene acceso al lago: bronze y
# silver son cientos de GiB y estan en la maquina del autor.
on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez. Si se encolan dos, el segundo espera en vez de
# pelearse por el mismo entorno.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Construir el sitio
        env:
          # El base path NO va aqui. Evidence lo lee de `deployment.basePath`
          # en evidence.config.yaml y de ningun otro sitio; un
          # EVIDENCE_BASE_PATH en el entorno se ignora en silencio y el sitio
          # sale sin estilos con el workflow en verde.
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm run sources
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/build

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
