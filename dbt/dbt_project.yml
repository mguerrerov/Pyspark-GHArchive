name: gharchive
version: "1.0.0"
config-version: 2

profile: gharchive

model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Ventana analizada (D19 quater). El tramo A y el tramo B se tratan igual
  # aqui; la diferencia de esquema se resolvio en silver.
  fecha_desde: "2025-08-13"
  fecha_hasta: "2026-08-15"

  # Fin de la ventana para las tablas de PR (preguntas 1 y 2). A partir del
  # 2026-03-15 el feed de GH Archive deja de traer eventos que no sean
  # PushEvent: la cuota de PR pasa del 12-14% estable a no volver al 10%, y en
  # agosto es del 0,13%. Es un defecto de la fuente, visible ya en bronze, no
  # del pipeline. Las series de PR se cortan aqui; la pregunta 3 mantiene
  # `fecha_hasta` porque se apoya en actividad de contribuyentes, que sigue
  # llegando. Ver D36 y metrics.md.
  fecha_pr_hasta: "2026-03-14"

models:
  gharchive:
    staging:
      +materialized: view
    marts:
      # Las dimensiones y hechos se materializan: el dashboard consulta muchas
      # veces y no conviene reescanear el Parquet en cada consulta.
      +materialized: table
